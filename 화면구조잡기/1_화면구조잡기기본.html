<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화면구조잡기 기본</title>
    <style>
        /*
            화면구조잡기 기본이라고 한다면
            항상 바깥쪽에서 안쪽으로 들어가면서 스타일을 하나씩 다듬어야함
        */

        /* 영역을 이루고 있는 모든 div 요소를 다 선택해서 공통 스타일 부여 */
        div {
            border : 1px solid red;
            /* 작업용 가이드 라인 */

            box-sizing : border-box;
            /*
                지급부터 지정하는 가로, 세로 길이는 (width, height 속성)
                테두리까지 포함한 길이임을 알려주는 속성!!

                - width, height 속성은 기본적으로 content 영역의 크기를 나타냄!!
                - 요소의 크기는 border 까지 포함해서 잡힘!!
                - content 영역을 기준으로 width, height 속성을 셋팅하면
                  이따 화면 구조를 잡을 때 중간에 padding 이 낀다거나,
                  border 가 좀 두꺼워진다거나 했을 때 화면 비율이 어그러질 수 밖에 없음!!
                - 이걸 방지하기 위해 설정을 잡아줌!!
            */
        }

        /* 전체를 감싸는 wrap */
        .wrap {
            width : 1000px;
            height : 800px;
            margin : auto;
            /* 좌우로 정 가운데로 배치해줌 */
        }

        /* 크게 세가지 영역 */
        /* header, content, footer 영역 */
        /*
            가능하다면 공통 스타일을 먼저 추려서 한번에 적고
            세부 스타일을 하나씩 지정해주는 것이 깔끔함
        */
        /* #header, #content, #footer { */
        .wrap>div {
            /* class 속성이 wrap 인 요소의 자손 요소 중 div 들만 선택하겠다 */

            width : 100%;
        }
        
        #header, #footer {
            height : 20%;
        }
        #content {
            height : 60%;
        }

        /* 세부 content 영역 */
        /* content_1, content_2 영역 */
        #content>div {
            height : 100%;
            float : left;
            /* 블록요소인 div 들을 붕 띄워서 옆으로 배치되게끔 */
        }

        #content_1 {
            width : 20%;
        }
        #content_2 {
            width : 80%;
        }
    </style>
</head>
<body>
    
    <div class="wrap">
        <div id="header"></div>
        <div id="content">
            <div id="content_1"></div>
            <div id="content_2"></div>
        </div>
        <div id="footer"></div>
    </div>

</body>
</html>
