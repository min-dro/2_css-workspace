<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세부_검색창 만들기</title>
    <style>
        /* div, form 공통스타일 */
        div, form {
            /* border : 1px solid red; */
            box-sizing : border-box;
        }

        /* 작업용 임시스타일 - 합칠 때 안가져갈 것 */
        #header_2 {
            width : 600px;
            height : 150px;
        }

        /* 합칠 때 가져갈 스타일이므로 따로 작성 */
        #header_2 {
            position: relative;
            /*
                search_form 을 절대적인 위치로 이동시키기 위해
                부모요소인 header_2 에 기준점을 잡아준다.
            */
        }

        /* 검색창 전체를 감싸는 search_form */
        #search_form {
            width : 80%;
            height : 20%;
            
            position: absolute;
            /*
                search_form 을 이동시키기 위해
                절대위치로 이동시키겠다 라는 absolute 속성 부여
            */
            top : 0px;
            bottom : 0px;
            left : 0px;
            right : 0px;
            /* 
                사방에서 0px 로 잡아당기겠다.
                정확하게 정중앙에 위치할 수 있도록 유도 가능!!
            */
            margin: auto;
            /* 여기까지 속성을 부여해야 정확히 이동 가능 */
        }

        /* search_form 상세 영역 */
        /* search_text, search_btn 영역 */
        /* 공통스타일 부여 */
        #search_form>div {
            height : 100%;
            float : left;
        }

        /* 각각의 스타일 부여 */
        #search_text {
            width : 80%; 
        }
        #search_btn {
            width : 20%;
        }

        /* input 요소들에 상세스타일 부여 */
        /* 검색어 입력용, 검색버튼용 input */
        #search_form input {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    
    <div id="header_2">
        <!-- 검색창 영역을 form 태그로 구성 -->
        <form id="search_form" action="search" method="get">
            <!-- 왼쪽 : 검색어를 입력할 부분 -->
            <div id="search_text">
                <input type="search" name="keyword">
            </div>
            <!-- 오른쪽 : 검색어를 입력할 부분 -->
            <div id="search_btn">
                <input type="submit" value="검색">
            </div>
        </form>
    </div>
    
</body>
</html>
