<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본생성자</title>
</head>
<body>
    
    <!--
        * CSS (Cascading Style Sheets)

        - HTML 구조 (뼈대) 는 그대로 두고,
          style 태그로 구조를 꾸미는 역할을 담당하는 스타일 언어
        - CSS3 버전이 웹 표준임

        * CSS 의 핵심

        - "뭐를" "어떻게" 꾸밀건지 작성
        선택자 : 꾸밀 요소를 선택 ("뭐를" 에 해당)
        스타일 속성 : 어떻게 꾸밀건지 속성명 : 속성값 형태로 작성

        [ 표현법 ]

        선택자 {
            속성명 : 속성값;
            속성명 : 속성값;
            ...
        }

        * CSS 스타일 부여 방법
        1. 인라인 스타일 방식 : 이 html 문서 내에 꾸미고자 하는 요소의 시작태그 쪽에
                               style 이라는 속성을 적고, 그 속성값으로 속성명 : 속성값을 기술하는 방식
                               style 부여 내용이 극소량일 경우에만 쓰는걸 권장!!
        2. 내부 스타일 방식 : 현재 이 html 문서에 적용하고자 하는 스타일 정보들을
                             이 html 문서의 head 영역 내부에 대놓고 <style> 태그를 작성하고
                             그 <style> 태그 안쪽에 꾸밀 내용을 작성하는 방법  
        3. 외부 스타일 방식 : .css 라는 확장자를 가진 외부 스타일 파일을 생성하고
                             그 파일 내부에 style 정보들을 기술한 후
                             꾸미고자 하는 html 파일의 head 영역에 <link> 태그를 이용하여
                             해당 .css 파일을 연동해주는 방식
    -->

</body>
</html>
